# ---------------------------------------------------------------------------
# viethoa.haiho.net — static site for the Vietnamese localization releases
#
# WHAT THIS DOES
#   * Serves the built pages straight out of the repo (~/dev/viethoa): `index.html`
#     at /, each game page at /<slug>/. `python3 build.py` writes them in place,
#     so there is no separate publish step.
#   * Loopback-only listener: the Cloudflare tunnel route for viethoa.haiho.net
#     points at http://localhost:8096. Nothing listens on :80, so no other vhost
#     can be shadowed by this block (learned from the temtem.haiho.net IPv6
#     incident, 2026-11-10).
#   * Source files are NOT web-served: .git, content/, deploy/, *.py, *.md and
#     *.json return 404. The built pages reference only ./static/*.
#
# ROUTES
#   /            index.html  (games list)
#   /<slug>/     <slug>/index.html  (e.g. /temtem/)
#   /static/...  screenshots, css, js, icons
#   /robots.txt, /sitemap.xml
#
# INSTALL (a human, on the Pi):
#   sudo ln -s /home/hazexon/dev/viethoa/deploy/nginx-viethoa.conf \
#              /etc/nginx/sites-enabled/viethoa.haiho.net.conf
#   sudo nginx -t && sudo systemctl reload nginx
# UNINSTALL:
#   sudo rm /etc/nginx/sites-enabled/viethoa.haiho.net.conf && sudo nginx -t \
#        && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

server {
    listen 127.0.0.1:8096;
    server_name viethoa.haiho.net;

    root /home/hazexon/dev/viethoa;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json
                  application/manifest+json image/svg+xml;

    # Behind the tunnel the scheme/host must not be rewritten into an http://:80 URL.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HTML is revalidated: a rebuild replaces these files, and a stale page would
    # keep pointing at the previous release.
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Screenshots and CSS change with a rebuild but keep their names.
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Repository furniture stays private: build inputs and VCS metadata are not site content.
    location ^~ /content/ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(py|md|json|gitignore|nojekyll|sh)$ { return 404; }
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires off;
        add_header Cache-Control "max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.txt$ { return 404; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # A 404 must never be cached: a screenshot may be added a few seconds after a page.
    error_page 404 = @notfound;
    location @notfound {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
